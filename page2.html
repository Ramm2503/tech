<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>RS-TECH - Add Employee</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #fff;
        }

        .sidebar {
            width: 220px;
            background: #f6f7fb;
            position: fixed;
            height: 100vh;
            left: 0;
            top: 0;
            padding-top: 32px;
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
        }

        .sidebar ul li {
            padding: 14px 30px;
            font-size: 18px;
            color: #757575;
        }

        .sidebar ul li.selected,
        .sidebar ul li:hover {
            background: #0086ff;
            color: #fff;
            border-radius: 24px 0 0 24px;
        }

        .main-content {
            margin-left: 220px;
            padding: 38px 40px;
        }

        .employee-container {
            background: #fff;
            border-radius: 12px;
            padding: 32px;
            margin-top: 24px;
            min-height: 340px;
        }

        h2 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 24px;
        }

        .form-label {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .form-row {
            display: flex;
            gap: 24px;
            margin-bottom: 16px;
        }

        .form-group {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .input,
        select {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #eee;
        }

        .profile-img {
            width: 72px;
            height: 72px;
            border-radius: 12px;
            object-fit: cover;
            margin-bottom: 18px;
        }

        .buttons {
            display: flex;
            gap: 12px;
        }

        .confirm-btn {
            background: #0086ff;
            color: #fff;
            padding: 9px 18px;
            border-radius: 8px;
            border: none;
        }

        .cancel-btn {
            background: #e3e3e3;
            color: #444;
            padding: 9px 18px;
            border-radius: 8px;
            border: none;
        }

        .nav-buttons {
            margin: 32px 0 0 0;
            display: flex;
            justify-content: center;
            gap: 18px;
        }

        .nav-btn {
            padding: 8px 15px;
            border-radius: 6px;
            border: none;
            color: #fff;
            background: #0086ff;
            cursor: pointer;
            font-size: 19px;
        }

        .reset-btn {
            background: #20b0ff;
        }
    </style>
    <script>
        function handleCancel() { window.location.href = 'page1.html'; }
    </script>
</head>

<body>
    <div class="sidebar">
        <ul>
            <li class="selected">Employee</li>
            <li>Dashboard</li>
            <li>Calendar</li>
            <li>Messages</li>
        </ul>
    </div>
    <div class="main-content">
        <div class="employee-container">
            <h2>Add New Employee</h2>
            <form>
                <div class="form-row">
                    <div class="form-group">
                        <img src="https://randomuser.me/api/portraits/women/44.jpg" class="profile-img"
                            alt="Profile Photo">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Name*</label>
                        <input class="input" type="text" value="Arlene">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Employee ID*</label>
                        <input class="input" type="text" value="671190345">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Department*</label>
                        <select class="input">
                            <option selected>Design</option>
                            <option>HR</option>
                            <option>Development</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Designation*</label>
                        <select class="input">
                            <option selected>Design Lead</option>
                            <option>Designer</option>
                            <option>Developer</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Project</label>
                        <input class="input" type="text" value="Car Rental">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Type*</label>
                        <select class="input">
                            <option selected>Office</option>
                            <option>Remote</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Status*</label>
                        <select class="input">
                            <option selected>Permanent</option>
                            <option>Contract</option>
                        </select>
                    </div>
                </div>
                <div class="buttons">
                    <button type="button" class="cancel-btn" onclick="handleCancel()">Cancel</button>
                    <button type="submit" class="confirm-btn">Confirm</button>
                </div>
            </form>
            <div class="nav-buttons">
                <button class="nav-btn" onclick="window.location.href='page1.html'">&lt;</button>
                <button class="nav-btn" onclick="window.location.href='page3.html'">&gt;</button>
                <button class="nav-btn reset-btn" onclick="window.location.href='page1.html'">Reset</button>
            </div>
        </div>
    </div>
</body>

</html>
