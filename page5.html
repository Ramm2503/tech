<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>RS-TECH - View Employee Details</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #fff;
        }

        .sidebar {
            width: 220px;
            background: #f6f7fb;
            position: fixed;
            height: 100vh;
            left: 0;
            top: 0;
            padding-top: 32px;
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
        }

        .sidebar ul li {
            padding: 14px 30px;
            font-size: 18px;
            color: #757575;
        }

        .sidebar ul li.selected,
        .sidebar ul li:hover {
            background: #0086ff;
            color: #fff;
            border-radius: 24px 0 0 24px;
        }

        .main-content {
            margin-left: 220px;
            padding: 38px 40px;
        }

        .employee-container {
            background: #fff;
            border-radius: 12px;
            padding: 32px;
            margin-top: 24px;
            min-height: 340px;
        }

        h2 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 24px;
        }

        .section-title {
            font-weight: bold;
            font-size: 1.07rem;
            margin-bottom: 10px;
            color: #0086ff;
        }

        .profile-img {
            width: 72px;
            height: 72px;
            border-radius: 12px;
            object-fit: cover;
            margin-bottom: 18px;
        }

        .info-row {
            display: flex;
            gap: 56px;
        }

        .info-col {
            margin-bottom: 15px;
        }

        .info-label {
            color: #888;
            font-size: 1rem;
        }

        .info-value {
            margin-left: 8px;
            font-weight: bold;
        }

        .nav-buttons {
            margin: 32px 0 0 0;
            display: flex;
            justify-content: center;
            gap: 18px;
        }

        .nav-btn {
            padding: 8px 15px;
            border-radius: 6px;
            border: none;
            color: #fff;
            background: #0086ff;
            cursor: pointer;
            font-size: 19px;
        }

        .reset-btn {
            background: #20b0ff;
        }
    </style>
    <script>
        let currentPage = 5;
        const totalPages = 7;
        function updatePageNumber() {
            document.getElementById('page-number').textContent = currentPage;
        }
        function navigateToPage(page) {
            window.location.href = 'page' + page + '.html';
        }
        function prevPage() {
            if (currentPage > 1) currentPage--; else currentPage = totalPages;
            updatePageNumber(); navigateToPage(currentPage);
        }
        function nextPage() {
            if (currentPage < totalPages) currentPage++; else currentPage = 1;
            updatePageNumber(); navigateToPage(currentPage);
        }
        function resetPage() { currentPage = 1; updatePageNumber(); navigateToPage(currentPage); }
        window.onload = updatePageNumber;
    </script>
</head>

<body>
    <div class="sidebar">
        <ul>
            <li>Dashboard</li>
            <li class="selected">Employee</li>
            <li>Calendar</li>
            <li>Messages</li>
        </ul>
    </div>
    <div class="main-content">
        <div class="employee-container">
            <h2>View Employee Details</h2>
            <div class="section-title">Personal Information</div>
            <img src="https://randomuser.me/api/portraits/women/44.jpg" class="profile-img" alt="Arlene">
            <div class="info-row">
                <div class="info-col">
                    <span class="info-label">Name</span><span class="info-value">Arlene</span><br>
                    <span class="info-label">Department</span><span class="info-value">Design</span><br>
                    <span class="info-label">Project</span><span class="info-value">Car Rental</span><br>
                    <span class="info-label">Status</span><span class="info-value">Permanent</span>
                </div>
                <div class="info-col">
                    <span class="info-label">Employee ID</span><span class="info-value">671190345</span><br>
                    <span class="info-label">Designation</span><span class="info-value">Design Lead</span><br>
                    <span class="info-label">Type</span><span class="info-value">Office</span>
                </div>
            </div>
            <div class="nav-buttons">
                <button class="nav-btn" onclick="prevPage()">&lt;</button>
                <span id="page-number" style="color:#0086ff;font-weight:bold;font-size:20px;padding:0 12px;">5</span>
                <button class="nav-btn" onclick="nextPage()">&gt;</button>
                <button class="nav-btn reset-btn" onclick="resetPage()">Reset</button>
            </div>
        </div>
    </div>
</body>

</html>
