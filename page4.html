<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RS-TECH - Employee List (Page 4)</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; background: #fff; }
        .sidebar {
            width: 220px; background: #f6f7fb; position: fixed; height: 100vh; left: 0; top: 0; padding-top: 32px;
        }
        .sidebar ul { list-style: none; padding: 0; }
        .sidebar ul li { padding: 14px 30px; font-size: 18px; color: #757575; }
        .sidebar ul li.selected, .sidebar ul li:hover { background: #0086ff; color: #fff; border-radius: 24px 0 0 24px; }
        .main-content {
            margin-left: 220px; padding: 38px 40px;
        }
        .employee-container { background: #fff; border-radius: 12px; padding: 32px; margin-top: 24px; min-height: 340px; }
        h2 { font-size: 2rem; font-weight: 700; margin-bottom: 24px; }
        .search-bar { float: right; margin-bottom: 12px; }
        .search-bar input { padding: 8px 12px; border-radius: 6px; border: 1px solid #eee; width: 180px; }
        .add-btn { background: #0086ff; color: #fff; border: none; padding: 10px 18px; border-radius: 8px; margin-left: 12px; }
        table { width: 100%; border-collapse: collapse; margin-top: 14px; }
        th, td { border-bottom: 1px solid #eee; padding: 12px; text-align: left; }
        th { background: #f6f7fb; font-weight: 600; }
        .profile-img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
        .action-icons { display: flex; gap: 18px; }
        .icon-btn { background: none; border: none; cursor: pointer; color: #666; font-size: 18px; }
        .icon-btn:hover { color: #0086ff; }
        .nav-buttons { margin: 32px 0 0 0; display: flex; justify-content: center; gap: 18px; }
        .nav-btn { padding: 8px 15px; border-radius: 6px; border: none; color: #fff; background: #0086ff; cursor: pointer; font-size: 19px; }
        .reset-btn { background: #20b0ff; }
    </style>
    <script>
        function goTo(page) {
            window.location.href = page;
        }
        function viewEmployee() {
            alert('View Employee clicked!');
        }
        function editEmployee() {
            alert('Edit Employee clicked!');
        }
        function deleteEmployee() {
            alert('Delete Employee clicked!');
        }
    </script>
</head>
<body>
    <div class="sidebar">
        <ul>
            <li>Dashboard</li>
            <li class="selected">Employee</li>
            <li>Calendar</li>
            <li>Messages</li>
        </ul>
    </div>
    <div class="main-content">
        <div class="employee-container">
            <h2>Employee</h2>
            <div class="search-bar">
                <input type="text" placeholder="Search" />
                <button class="add-btn" onclick="goTo('page2.html')">+ Add New Employee</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Employee Name</th>
                        <th>Employee ID</th>
                        <th>Department</th>
                        <th>Designation</th>
                        <th>Project</th>
                        <th>Type</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>
                            <img src="https://randomuser.me/api/portraits/women/44.jpg" class="profile-img" alt="Arlene"> Arlene
                        </td>
                        <td>671190345</td>
                        <td>Design</td>
                        <td>Design Lead</td>
                        <td>Car Rental</td>
                        <td>Office</td>
                        <td><span style="font-weight: bold;">Permanent</span></td>
                        <td>
                            <div class="action-icons">
                                <button class="icon-btn" title="View" onclick="viewEmployee()">&#128065;</button>
                                <button class="icon-btn" title="Edit" onclick="editEmployee()">&#9998;</button>
                                <button class="icon-btn" title="Delete" onclick="deleteEmployee()">&#128465;</button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
            <div class="nav-buttons">
                <button class="nav-btn" onclick="goTo('page3.html')">&lt;</button>
                <button class="nav-btn" onclick="goTo('page5.html')">&gt;</button>
                <button class="nav-btn reset-btn" onclick="goTo('page1.html')">Reset</button>
            </div>
        </div>
    </div>
</body>
</html>
