<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>RS-TECH - Edit Employee Details</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #fff;
        }

        .sidebar {
            width: 220px;
            background: #f6f7fb;
            position: fixed;
            height: 100vh;
            left: 0;
            top: 0;
            padding-top: 32px;
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
        }

        .sidebar ul li {
            padding: 14px 30px;
            font-size: 18px;
            color: #757575;
        }

        .sidebar ul li.selected,
        .sidebar ul li:hover {
            background: #0086ff;
            color: #fff;
            border-radius: 24px 0 0 24px;
        }

        .main-content {
            margin-left: 220px;
            padding: 38px 40px;
        }

        .employee-container {
            background: #fff;
            border-radius: 12px;
            padding: 32px;
            margin-top: 24px;
            min-height: 340px;
        }

        h2 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 24px;
        }

        .section-title {
            font-weight: bold;
            font-size: 1.07rem;
            margin-bottom: 10px;
            color: #0086ff;
        }

        .profile-img {
            width: 72px;
            height: 72px;
            border-radius: 12px;
            object-fit: cover;
            margin-bottom: 18px;
        }

        .form-row {
            display: flex;
            gap: 24px;
            margin-bottom: 16px;
        }

        .form-group {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .input,
        select {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #eee;
            margin-bottom: 10px;
        }

        .btns {
            margin-top: 20px;
        }

        .cancel-btn,
        .update-btn {
            padding: 10px 18px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
        }

        .cancel-btn {
            background: #e3e3e3;
            color: #007;
        }

        .update-btn {
            background: #0086ff;
            color: #fff;
        }

        .nav-buttons {
            margin: 32px 0 0 0;
            display: flex;
            justify-content: center;
            gap: 18px;
        }

        .nav-btn {
            padding: 8px 15px;
            border-radius: 6px;
            border: none;
            color: #fff;
            background: #0086ff;
            cursor: pointer;
            font-size: 19px;
        }

        .reset-btn {
            background: #20b0ff;
        }
    </style>
    <script>
        let currentPage = 6;
        const totalPages = 7;
        function updatePageNumber() { document.getElementById('page-number').textContent = currentPage; }
        function navigateToPage(page) { window.location.href = 'page' + page + '.html'; }
        function prevPage() { if (currentPage > 1) currentPage--; else currentPage = totalPages; updatePageNumber(); navigateToPage(currentPage); }
        function nextPage() { if (currentPage < totalPages) currentPage++; else currentPage = 1; updatePageNumber(); navigateToPage(currentPage); }
        function resetPage() { currentPage = 1; updatePageNumber(); navigateToPage(currentPage); }
        window.onload = updatePageNumber;
    </script>
</head>

<body>
    <div class="sidebar">
        <ul>
            <li>Dashboard</li>
            <li class="selected">Employee</li>
            <li>Calendar</li>
            <li>Messages</li>
        </ul>
    </div>
    <div class="main-content">
        <div class="employee-container">
            <h2>Edit Employee Details</h2>
            <div class="section-title">Personal Information</div>
            <form>
                <div class="form-row">
                    <div class="form-group">
                        <img src="https://randomuser.me/api/portraits/women/44.jpg" class="profile-img" alt="Arlene">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Name*</label>
                        <input class="input" type="text" value="Arlene">
                    </div>
                    <div class="form-group">
                        <label>Employee ID*</label>
                        <input class="input" type="text" value="671190345">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Department*</label>
                        <select class="input">
                            <option selected>Design</option>
                            <option>HR</option>
                            <option>Development</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Designation*</label>
                        <select class="input">
                            <option selected>Design Lead</option>
                            <option>Designer</option>
                            <option>Developer</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Project</label>
                        <input class="input" type="text" value="Car Rental">
                    </div>
                    <div class="form-group">
                        <label>Type*</label>
                        <select class="input">
                            <option selected>Office</option>
                            <option>Remote</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Status*</label>
                        <select class="input">
                            <option selected>Permanent</option>
                            <option>Contract</option>
                        </select>
                    </div>
                </div>
                <div class="btns">
                    <button type="button" class="cancel-btn" onclick="navigateToPage(4)">Cancel</button>
                    <button type="submit" class="update-btn">Update</button>
                </div>
            </form>
            <div class="nav-buttons">
                <button class="nav-btn" onclick="prevPage()">&lt;</button>
                <span id="page-number" style="color:#0086ff;font-weight:bold;font-size:20px;padding:0 12px;">6</span>
                <button class="nav-btn" onclick="nextPage()">&gt;</button>
                <button class="nav-btn reset-btn" onclick="resetPage()">Reset</button>
            </div>
        </div>
    </div>
</body>

</html>
